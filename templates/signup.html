<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="signup_page_title">Sign Up | BINBRAIN</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body class="auth-body"><div class="auth-art signup-art"><a class="brand" href="/"><span class="brand-mark">🌿</span>BINBRAIN</a><div><span class="hero-kicker" data-i18n="join_badge">JOIN THE GREEN COMMUNITY</span><h1 data-i18n="signup_art_title">Build cleaner habits. Earn eco rewards.</h1><p data-i18n="signup_art_text">One scan, one report and one responsible choice can create a better future.</p></div></div><div class="auth-card"><div class="auth-top"><a href="/" class="brand dark"><span class="brand-mark">🌿</span>BINBRAIN</a><select id="languageSelector" class="lang-select light"><option value="en">🇬🇧 English</option><option value="te">🇮🇳 తెలుగు</option><option value="hi">🇮🇳 हिन्दी</option></select></div><h2 data-i18n="create_account">Create your account</h2><p data-i18n="signup_subtitle">Start your cleaner village journey today.</p>{% if error %}<div class="alert-box error">{{ error }}</div>{% endif %}<form method="post"><label data-i18n="name_label">Full Name</label><input name="name" data-i18n-placeholder="name_placeholder" placeholder="Enter your name" required><label data-i18n="email_label">Email</label><input type="email" name="email" data-i18n-placeholder="email_placeholder" placeholder="Enter your email" required><label data-i18n="password_label">Password</label><input type="password" name="password" data-i18n-placeholder="password_placeholder" placeholder="Create a password" required><button class="btn-primary full-btn" data-i18n="signup">Sign Up</button></form><p class=
